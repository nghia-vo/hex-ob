# databroker v0/v1 legacy config pointing at the local MongoDB (docker-compose).
# Copy to ~/.config/databroker/_legacy_config.yml and ~/.config/databroker/hex.yml
# if a profile still uses databroker.Broker.named(...). Modern HEX startup writes
# through Tiled (TiledWriter), so this is only for legacy compatibility.
metadatastore:
    module: 'databroker.headersource.mongo'
    class: 'MDS'
    config:
        host: 'localhost'
        port: 27017
        database: 'metadatastore-local'
        timezone: 'US/Eastern'
assets:
    module: 'databroker.assets.mongo'
    class: 'Registry'
    config:
        host: 'localhost'
        port: 27017
        database: 'asset-registry-local'
